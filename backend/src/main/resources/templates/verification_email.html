<!DOCTYPE html>
<html lang="en" style="font-family: Arial, sans-serif">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verify Your Account</title>
    </head>
    <body style="background-color: #f4f4f7; margin: 0; padding: 0">
        <table
            align="center"
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%%"
            style="
                max-width: 600px;
                background-color: #ffffff;
                margin-top: 40px;
                border-radius: 10px;
                box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            "
        >
            <tr>
                <td
                    align="center"
                    style="
                        padding: 30px 0;
                        background-color: #4f46e5;
                        border-radius: 10px 10px 0 0;
                    "
                >
                    <h1 style="color: #ffffff; margin: 0">MyStudyPal</h1>
                </td>
            </tr>
            <tr>
                <td style="padding: 40px 30px 20px 30px">
                    <h2 style="color: #333333">Verify Your Email</h2>
                    <p
                        style="
                            color: #555555;
                            font-size: 16px;
                            line-height: 1.5;
                        "
                    >
                        Hi there 👋,<br /><br />
                        Thanks for signing up! Please confirm your email address
                        by using the verification code below:
                    </p>
                    <div style="text-align: center; margin: 30px 0">
                        <span
                            style="
                                display: inline-block;
                                background-color: #4f46e5;
                                color: #ffffff;
                                font-size: 24px;
                                letter-spacing: 4px;
                                padding: 15px 25px;
                                border-radius: 8px;
                                font-weight: bold;
                            "
                        >
                            %s
                        </span>
                    </div>
                    <p style="color: #555555; font-size: 14px">
                        This code will expire in 10 minutes. If you didn’t
                        request this, you can safely ignore this email.
                    </p>
                </td>
            </tr>
            <tr>
                <td
                    align="center"
                    style="
                        padding: 20px;
                        background-color: #f4f4f7;
                        border-radius: 0 0 10px 10px;
                        color: #888888;
                        font-size: 12px;
                    "
                >
                    © 2025 MyStudyPal. All rights reserved.
                </td>
            </tr>
        </table>
    </body>
</html>
