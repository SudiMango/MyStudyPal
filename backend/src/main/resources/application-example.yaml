spring:
    application:
        name: MyStudyPal

    datasource:
        url: { DB_URL }
        username: { DB_USERNAME }
        password: { DB_PASSWORD }
        driver-class-name: org.postgresql.Driver
        hikari:
            data-source-properties:
                sslmode: require

    jpa:
        show-sql: true
        hibernate:
            ddl-auto: update

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: { GOOGLE_CLIENT_ID }
                        client-secret: { GOOGLE_CLIENT_SECRET }
                        scope:
                            - email
                            - profile

    mail:
        username: { MAIL_USERNAME }
        password: { MAIL_PASSWORD }

    servlet:
        multipart:
            max-file-size: 100MB
            max-request-size: 100MB

jwt:
    secret:
        key: { JWT_SECRET_KEY }

logging:
    level:
        org:
            springframework:
                security: DEBUG

gemini:
    api:
        key: { GEMINI_API_KEY }

server:
    tomcat:
        max-swallow-size: 100MB
        max-http-form-post-size: 100MB
